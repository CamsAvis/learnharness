	<!-- The app mark (components/lh-mark.tsx) as the browser-tab icon. Next.js
	     serves app/icon.svg and adds the <link rel="icon"> itself. A tab icon
	     can't see the page's CSS variables, so it follows the browser's own
	     light/dark preference: the original grey + white on dark tab strips,
	     Paper's burgundy + ink on light ones (where white would vanish). -->
	<style>
		.ring { fill: #949494; }
		.ink { fill: #ffffff; }
		@media (prefers-color-scheme: light) {
			.ring { fill: #8a3b2c; }
